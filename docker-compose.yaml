services:
  backend:
    build:
      context: ./
      dockerfile: dockerfile_backend
      image: localhost/claytracker_backend:latest
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./
      dockerfile: dockerfile_frontend
      image: localhost/claytracker_frontend:latest
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: docker.io/postgres:17
    restart: always
    environment:
      - POSTGRES_USER=postgres # change
      - POSTGRES_PASSWORD=mysscretpassword # change
      - POSTGRES_DB=range_tracker
    volumes:
      - ./data:/var/lib/postgresql/data:Z
