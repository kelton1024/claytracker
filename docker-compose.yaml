services:
  web:
    build:
      context: ./
      dockerfile: dockerfile
      image: localhost/claytracker_web:latest
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: docker.io/postgres:17
    restart: always
    environment:
      - POSTGRES_USER=postgres # change
      - POSTGRES_PASSWORD=mysscretpassword # change
      - POSTGRES_DB=range_tracker
    volumes:
      - ./data:/var/lib/postgresql/data:Z
